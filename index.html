<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanCart - Shop Smarter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛒</span>
      <span>UrbanCart</span>
    </div>

    <div class="filters">
      <input
        id="search"
        type="search"
        placeholder="Search products..."
        oninput="applyFilters()"
      >
      <select id="category" onchange="applyFilters()"></select>
    </div>

    <button class="cart-btn" onclick="toggleCart()">
      🛍️ Cart
      <span id="cartCount" class="badge">0</span>
    </button>
  </header>

  <!-- ===== Main layout ===== -->
  <main class="layout">

    <section class="catalog">
      <h1>Featured Products</h1>
      <p class="muted" id="resultInfo"></p>
      <div id="productGrid" class="grid"></div>
      <p id="emptyResults" class="empty hidden">No products match your search.</p>
    </section>

    <!-- ===== Cart ===== -->
    <aside id="cartPanel" class="cart-panel">
      <div class="cart-head">
        <h2>Your Cart</h2>
        <button class="icon-btn" onclick="toggleCart()" title="Close cart">✕</button>
      </div>

      <div id="cartItems" class="cart-items"></div>
      <div id="cartSummary" class="summary"></div>
    </aside>

  </main>

  <div id="overlay" class="overlay" onclick="toggleCart()"></div>

  <!-- ===== Checkout modal ===== -->
  <div id="checkoutModal" class="modal hidden">
    <div class="modal-card">
      <h2>Checkout</h2>
      <p class="muted">Enter your delivery details to place the order.</p>

      <form onsubmit="placeOrder(event)">
        <label>Full name
          <input id="custName" type="text" placeholder="Sriram S" required>
        </label>

        <label>Email
          <input id="custEmail" type="email" placeholder="you@example.com" required>
        </label>

        <label>Delivery address
          <textarea id="custAddress" rows="2" placeholder="House no, street, city, PIN" required></textarea>
        </label>

        <label>Payment method
          <select id="payMethod" required>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="UPI">UPI</option>
            <option value="Credit / Debit Card">Credit / Debit Card</option>
          </select>
        </label>

        <div id="checkoutTotal" class="pay-total"></div>

        <div class="modal-actions">
          <button type="button" class="ghost" onclick="closeCheckout()">Cancel</button>
          <button type="submit" class="primary">Place Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Order confirmation ===== -->
  <div id="successModal" class="modal hidden">
    <div class="modal-card center">
      <div class="tick">✅</div>
      <h2>Order Placed!</h2>
      <p id="successText" class="muted"></p>
      <div id="successSummary" class="receipt"></div>
      <button class="primary wide" onclick="closeSuccess()">Continue Shopping</button>
    </div>
  </div>

  <footer class="footer">
    <p>FSWD Exercise 2-B &middot; Sales / e-Commerce demo &middot; Built with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
